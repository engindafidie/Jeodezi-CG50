name: Casio CG50 G3A Derleyici

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: tarigo/prizmsdk:latest
    steps:
      - name: Dosyalari Cek
        uses: actions/checkout@v4

      - name: G3A Dosyasini Derle
        run: |
          mkdir -p src build
          if [ -f "jeodezi_g3a_main.c" ]; then cp jeodezi_g3a_main.c src/main.c; fi
          if [ -f "main.c" ]; then cp main.c src/main.c; fi
          printf "APPNAME = JEODEZI\nBUILDDIR = build\nSRCDIR = src\nLIBS = -lfxcg -lm -lc -lgcc\ninclude \$(FXCGSDK)/toolchain/prizm.bd\n" > Makefile
          make

      - name: Hazir G3A Dosyasini Paketle
        uses: actions/upload-artifact@v4
        with:
          name: JEODEZI_CG50_G3A
          path: "*.g3a"
