name: Casio CG50 G3A Derleyici

on:
  push:
  workflow_dispatch:

env:
  CROSS_PREFIX: /opt/cross
  BINUTILS_VER: "2.42"
  GCC_VER: "13.2.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Dosyalari Cek
        uses: actions/checkout@v4

      - name: Gerekli Paketleri Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git wget texinfo flex bison \
            libgmp-dev libmpfr-dev libmpc-dev libpng-dev zlib1g-dev

      - name: Toolchain Cache Geri Yukle
        id: cache-toolchain
        uses: actions/cache/restore@v4
        with:
          path: /opt/cross
          key: sh3eb-elf-binutils-${{ env.BINUTILS_VER }}-gcc-${{ env.GCC_VER }}

      - name: sh3eb-elf Toolchain Derle
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p $CROSS_PREFIX
          sudo chown $USER $CROSS_PREFIX
          export PATH="$CROSS_PREFIX/bin:$PATH"
          cd /tmp

          wget -q https://ftpmirror.gnu.org/gnu/binutils/binutils-$BINUTILS_VER.tar.xz
          wget -q https://ftpmirror.gnu.org/gnu/gcc/gcc-$GCC_VER/gcc-$GCC_VER.tar.xz
          tar xf binutils-$BINUTILS_VER.tar.xz
          tar xf gcc-$GCC_VER.tar.xz

          mkdir build-binutils
          cd build-binutils
          ../binutils-$BINUTILS_VER/configure --target=sh3eb-elf --prefix=$CROSS_PREFIX \
            --disable-nls --disable-werror
          make -j$(nproc)
          make install
          cd /tmp

          mkdir build-gcc
          cd build-gcc
          ../gcc-$GCC_VER/configure --target=sh3eb-elf --prefix=$CROSS_PREFIX \
            --disable-nls --enable-languages=c --without-headers --with-newlib \
            --disable-shared --disable-threads --disable-libssp --disable-libgomp \
            --disable-libquadmath --disable-libatomic
          make -j$(nproc) all-gcc all-target-libgcc
          make install-gcc install-target-libgcc

      - name: Toolchain Cache Kaydet
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/cross
          key: sh3eb-elf-binutils-${{ env.BINUTILS_VER }}-gcc-${{ env.GCC_VER }}

      - name: PATH Ayarla
        run: echo "$CROSS_PREFIX/bin" >> $GITHUB_PATH

      - name: libfxcg Derle
        run: |
          git clone --depth 1 https://github.com/Jonimoose/libfxcg.git /tmp/libfxcg
          make -C /tmp/libfxcg

      - name: mkg3a Derle
        run: |
          git clone --depth 1 https://github.com/tari/mkg3a.git /tmp/mkg3a
          cd /tmp/mkg3a
          cmake .
          make -j$(nproc)
          sudo make install

      - name: G3A Dosyasini Derle
        run: |
          SRC_FILE="main.c"
          if [ ! -f "$SRC_FILE" ] && [ -f "jeodezi_g3a_main.c" ]; then
            SRC_FILE="jeodezi_g3a_main.c"
          fi

          SDK=/tmp/libfxcg
          LDSCRIPT=$(find $SDK -name "prizm.x" | head -n 1)
          LIBDIR=$(dirname $(find $SDK -name "libfxcg.a" | head -n 1))
          echo "LDSCRIPT=$LDSCRIPT"
          echo "LIBDIR=$LIBDIR"

          CFLAGS="-I$SDK/include -I. -include compat.h -mb -m4a-nofpu -mhitachi -Os -Wall -ffunction-sections -fdata-sections"

          sh3eb-elf-gcc -c compat.c -o compat.o $CFLAGS
          sh3eb-elf-gcc -c "$SRC_FILE" -o main.o $CFLAGS

          sh3eb-elf-gcc -mb -m4a-nofpu -nostdlib -nostartfiles \
            -Wl,-static -Wl,--gc-sections \
            -T"$LDSCRIPT" main.o compat.o -L"$LIBDIR" -lfxcg -lgcc \
            -o jeodezi.elf

          sh3eb-elf-objcopy -R .comment -R .bss -O binary jeodezi.elf jeodezi.bin

          mkg3a -n basic:JEODEZI -n internal:@JEODEZI jeodezi.bin JEODEZI.g3a
          ls -la *.g3a

      - name: Hazir G3A Dosyasini Paketle
        uses: actions/upload-artifact@v4
        with:
          name: JEODEZI_CG50_G3A
          path: "*.g3a"
          if-no-files-found: error
